<!DOCTYPE html>

<html lang="pt-br"> 
    <head>
        <meta charset="utf-8" >
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
         <script type="module" src="frontend\autentication\js\cpfFormatation.js"></script>
        <title>Tela de registro pro sistema bancario</title>
    </head>
    <body>

        <!--Nome do banco-->
        <h1><b>SYMBANK</b></h1>


        <!--Formulario de resgistro do usuario-->
        <form action="" method="post" id="register" name="register">

            <fieldset name="user_data" form="register">
                <legend>Registro</legend>
                
                <label for="name">Nome:</label>
                <input type="text" minlength="5" required
                id="name" name="name" 
                placeholder="Digite seu Nome" 
                autofocus>

                <br>

                <label for="cpf">CPF:</label>
                <input type="text" required 
                id="cpf" name="cpf" 
                minlength="11" maxlength="14"
                placeholder="Digite seu CPF" 
                pattern="^\d{3}\.\d{3}\.\d{3}-\d{2}$"
                oninput="formatCpf()"
                oninvalid="this.setCustomValidity('Digite um CPF no formato 000.000.000-00')"
                >
                <br>

                <label for="gender">Sexo:</label>
                <select name="sexo" id="sexo">
                    <option value="outro" >Outro</option>
                    <option value="masculino">Masculino</option>
                    <option value="feminino">Feminino</option>
                </select>

                <br>

                <label for="phone">Telefone:</label>
                <input type="text" required
                id="phone" name="phone"
                placeholder="Digite seu telefone"
                pattern="^([1-9]{2})(?:9[0-9]|[2-8])[0-9]{3}[0-9]{4}$">

                <br>

                <label for="datebirth">Data de Nascimento:</label>
                <input type="date" required
                id="datebirth" name="datebirth"
                oninput="dateBirthValidation()">

                <br>

                <label for="password">Senha:</label>
                <input type="password" required
                id="password" name="password"
                placeholder="Digite sua Senha"
                pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$"
                oninvalid="this.setCustomValidity('A senha deve ter pelo menos 8 caracteres, uma letra maiúscula e um número.')"
                >
            </fieldset>

            <fieldset name="register_opt" form="register">
                <button type="submit" value="registration">Enviar Registro</button>
                <button type="reset">Limpar Registro</button>
                <br>
                <a href="loginWindow.html" > <i>já tem uma conta? Faça Login!</i></a>
            </fieldset>


        </form>
        
        <script src="./cpfFormatation.js"></script>
        
    </body>
        <script type="text/javascript">

        /**
        * Verifica se uma data de nascimento passada é valida para registro.
        */
        function dateBirthValidation() {

            try {
                    
                let element = document.getElementById("datebirth");
                
                let dateBirth = new Date(element.value);

                let actualDate = new Date(Date.now());

                // quantidade de mss percorridos entre uma data de nascimento
                // e a data atual 
                let dateMss = (actualDate.valueOf() - dateBirth.valueOf())

                if(dateMss < 0) {
                    throw new Error("Não são aceitas datas do futuro. Por favor, utilize uma data de nascimento valida.");
                }
                else {

                    // converte os milesegundos em anos
                    let dateYears = Math.floor((actualDate.valueOf() - dateBirth.valueOf()) / 31557600000);

                    // individuo é menor de idade
                    if(dateYears < 18) {
                        throw new Error("Não aceitamos usuarios menores de idade.");
                    }
                    // individuo tem uma idade improvavel
                    if(dateYears > 130){
                        throw new Error("Data de nascimento invalida");
                    }

                }       
            } catch (error) {
                alert(error.message);
            }
            
        }


    </script>



</html>
