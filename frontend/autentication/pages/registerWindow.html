<!DOCTYPE html>

<html lang="pt-br"> 
    <head>
        <meta charset="utf-8" >
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script type="module" src="../js/sendAuthRequest.js"></script>
        <title>Tela de registro pro sistema bancario</title>
    </head>
    <body>

        <!--Nome do banco-->
        <h1><b>SYMBANK</b></h1>


        <!--Formulario de resgistro do usuario-->
        <form id="authForm" name="authForm" action="http://localhost:8080/api/auth/register">

            <fieldset name="user_data">
                <legend>Registro</legend>
                
                <label for="name">Nome:</label>
                <input type="text" minlength="5" required
                id="name" name="name" 
                placeholder="Digite seu Nome" 
                autofocus>

                <br>

                <label for="cpf">CPF:</label>
                <input type="text" required 
                id="cpf" name="cpf" 
                minlength="11" maxlength="14"
                placeholder="Digite seu CPF" 
                pattern="^\d{3}\.\d{3}\.\d{3}-\d{2}$"
                >
                <!--oninvalid="this.setCustomValidity('Digite um CPF no formato 000.000.000-00')"-->
                <br>

                <label for="gender">Sexo:</label>
                <select name="gender" id="gender">
                    <option value="outro" >Outro</option>
                    <option value="masculino">Masculino</option>
                    <option value="feminino">Feminino</option>
                </select>

                <br>

                <label for="phone">Telefone:</label>
                <input type="tel" required
                id="phone" name="phone"
                placeholder="Digite seu telefone"
                pattern="^([1-9]{2})(?:9[0-9]|[2-8])[0-9]{3}[0-9]{4}$">

                <br>

                <label for="dateBirth">Data de Nascimento:</label>
                <input type="date" required
                id="dateBirth" name="dateBirth">

                <br>

                <label for="password">Senha:</label>
                <input type="password" required
                id="password" name="password"
                placeholder="Digite sua Senha"
                pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$"
               
                >
                <!-- oninvalid="this.setCustomValidity('A senha deve ter pelo menos 8 caracteres, uma letra maiúscula e um número.')"-->
            </fieldset>

            <fieldset name="register_opt">
                <button type="submit" value="registration" >Enviar Registro</button>
                <button type="reset">Limpar Registro</button>
                <br>
                <a href="loginWindow.html" > <i>já tem uma conta? Faça Login!</i></a>
            </fieldset>


        </form>

        <script src="../js/cpfFormatation.js"></script>
        <script src="../js/dateBirthValidation.js"></script>
        <script src="../temporary/autocomplete.js"></script>
    </body>
</html>
